<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="LM3.svg" />
  <title>Byllora — Coming Soon</title>
  <meta name="description" content="Byllora is coming soon. Stay tuned for something amazing." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --yellow: #FFD727;
      --dark:   #1a1200;
      --mid:    #3d2e00;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--yellow);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ── subtle radial glow in centre ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%,
        rgba(255,255,255,0.25) 0%,
        transparent 70%);
      pointer-events: none;
    }

    /* ── floating grain texture ── */
    body::after {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      animation: grain 8s steps(10) infinite;
    }

    @keyframes grain {
      0%,100% { transform: translate(0,0); }
      10%      { transform: translate(-2%,-3%); }
      20%      { transform: translate(3%,1%); }
      30%      { transform: translate(-1%,4%); }
      40%      { transform: translate(4%,-2%); }
      50%      { transform: translate(-3%,3%); }
      60%      { transform: translate(2%,-4%); }
      70%      { transform: translate(-4%,2%); }
      80%      { transform: translate(1%,-1%); }
      90%      { transform: translate(-2%,4%); }
    }

    /* ── main container ── */
    .splash {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── logo ── */
    .logo-wrap {
      width: clamp(100px, 18vw, 220px);
      aspect-ratio: 616 / 685;
      filter: drop-shadow(0 8px 32px rgba(0,0,0,0.18));
      animation: logoPulse 4s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 8px 32px rgba(0,0,0,0.18)); }
      50%       { filter: drop-shadow(0 12px 48px rgba(0,0,0,0.30)); }
    }

    /* ── brand name ── */
    .brand {
      margin-top: 28px;
      font-size: clamp(3rem, 10vw, 7.5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--dark);
      line-height: 1;
      display: flex;
      align-items: center;
    }

    /* typewriter cursor */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 0.85em;
      background: var(--dark);
      margin-left: 4px;
      border-radius: 2px;
      animation: blink 0.75s step-end infinite;
      vertical-align: middle;
      position: relative;
      top: -0.04em;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── divider ── */
    .divider {
      margin-top: 18px;
      width: clamp(40px, 8vw, 72px);
      height: 3px;
      background: var(--dark);
      border-radius: 99px;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.6s cubic-bezier(0.22,1,0.36,1), opacity 0.4s;
    }

    .divider.show {
      opacity: 0.35;
      transform: scaleX(1);
    }

    /* ── coming soon ── */
    .tagline {
      margin-top: 16px;
      font-size: clamp(0.7rem, 2.2vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--mid);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .tagline.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── small footer note ── */
    .footer {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--dark);
      opacity: 0.3;
      white-space: nowrap;
      z-index: 1;
    }
  </style>
</head>
<body>

  <main class="splash" aria-label="Byllora splash screen">

    <div class="logo-wrap" id="logo" aria-hidden="true">
      <img src="LM3.svg" alt="Byllora logomark" />
    </div>

    <h1 class="brand" id="brand" aria-label="Byllora">
      <span id="typed-text"></span><span class="cursor" id="cursor"></span>
    </h1>

    <div class="divider" id="divider" aria-hidden="true"></div>

    <p class="tagline" id="tagline">Coming Soon</p>

  </main>

  <footer class="footer">© 2026 Byllora</footer>

  <script>
    const WORD      = 'Byllora';
    const TYPE_SPEED   = 80;   // ms per character
    const PAUSE_AFTER  = 600;   // ms after full word before showing tagline

    const typedEl  = document.getElementById('typed-text');
    const cursor   = document.getElementById('cursor');
    const divider  = document.getElementById('divider');
    const tagline  = document.getElementById('tagline');

    let i = 0;

    function type() {
      if (i <= WORD.length) {
        typedEl.textContent = WORD.slice(0, i);
        i++;
        setTimeout(type, TYPE_SPEED);
      } else {
        // word complete — hide cursor blink, reveal tagline
        setTimeout(() => {
          cursor.style.animation = 'none';
          cursor.style.opacity   = '0';
          divider.classList.add('show');
          setTimeout(() => tagline.classList.add('show'), 150);
        }, PAUSE_AFTER);
      }
    }

    // slight delay before starting so the fade-up animation settles
    setTimeout(type, 700);
  </script>

</body>
</html>
